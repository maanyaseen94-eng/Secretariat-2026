<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الطلبات الواردة</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-placeholder"></div>
    <div class="main-content">
      <div id="topbar-placeholder"></div>
      <div class="page-body">

        <div class="panel">
          <div class="panel-header d-flex justify-content-between align-items-center">
            <span>الطلبات الواردة</span>
            <button class="btn btn-sm btn-light" onclick="location.href='create-letter.html'"><i class="fa-solid fa-plus"></i> كتاب رسمي جديد</button>
          </div>
          <div class="panel-body">

            <div class="d-flex flex-wrap gap-2 mb-3">
              <button class="btn btn-secondary btn-sm" onclick="archiveSelected()"><i class="fa-solid fa-box-archive"></i> أرشفة المحدد</button>
              <button class="btn btn-info btn-sm text-white" onclick="downloadSelectedAttachments()"><i class="fa-solid fa-paperclip"></i> تحميل مرفقات المحددة</button>
              <button class="btn btn-primary btn-sm" onclick="downloadSelected()"><i class="fa-solid fa-download"></i> تحميل المحدد</button>

              <div class="btn-group btn-group-sm ms-auto" role="group">
                <button class="btn btn-outline-secondary active" data-filter="all" onclick="setFilter('all', this)">الكل</button>
                <button class="btn btn-outline-secondary" data-filter="updated" onclick="setFilter('updated', this)">المحدثة <span class="filter-count" data-count-for="updated"></span></button>
                <button class="btn btn-outline-secondary" data-filter="unread" onclick="setFilter('unread', this)">الغير مقروءة <span class="filter-count" data-count-for="unread"></span></button>
                <button class="btn btn-outline-secondary" data-filter="archived" onclick="setFilter('archived', this)">المؤرشفة</button>
              </div>
            </div>

            <div class="d-flex flex-wrap justify-content-between align-items-center mb-2 gap-2">
              <div class="d-flex align-items-center gap-2">
                <button class="btn btn-outline-secondary btn-sm" onclick="window.print()"><i class="fa-solid fa-print"></i> طباعة</button>
                <button class="btn btn-outline-success btn-sm" onclick="exportExcel()"><i class="fa-solid fa-file-excel"></i> Excel</button>
                <select id="pageSizeSelect" class="form-select form-select-sm w-auto" onchange="renderTable()">
                  <option value="10">10</option><option value="25">25</option><option value="50">50</option>
                </select>
              </div>
              <input type="text" id="searchInput" class="form-control form-control-sm w-auto" placeholder="ابحث بعنوان الكتاب، الرقم، التاريخ أو الجهة..." oninput="renderTable()">
            </div>

            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead>
                  <tr>
                    <th><input type="checkbox" id="checkAll" onclick="toggleAll(this)"></th>
                    <th>ت</th>
                    <th>عنوان الكتاب</th>
                    <th>الرقم</th>
                    <th>التاريخ</th>
                    <th>الجهة المرسلة</th>
                    <th>الجهة المستلمة</th>
                    <th>تاريخ ووقت الاستلام</th>
                    <th>تاريخ ووقت القراءة</th>
                    <th>الحالة</th>
                    <th>تنبيه</th>
                    <th>خيارات</th>
                  </tr>
                </thead>
                <tbody id="tableBody">
                  <tr><td colspan="12" class="text-center text-muted py-4">جارِ التحميل...</td></tr>
                </tbody>
              </table>
            </div>

            <nav>
              <ul class="pagination pagination-sm justify-content-center" id="pagination"></ul>
            </nav>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth-guard.js"></script>
  <script src="sidebar.js"></script>
  <script>
    renderShell('incoming', 'الطلبات الواردة');

    let ALL_LETTERS = [];
    let CURRENT_FILTER = 'all';
    let CURRENT_PAGE = 1;

    PERMS_READY.then(() => {
      if (!hasPermission('deleteArchive')) {
        document.querySelector('button[onclick="archiveSelected()"]').style.display = 'none';
      }
      loadLetters();
    });

    // نحول Timestamp/Date تبع Firestore لنص تاريخ+وقت مقروء
    function fmtDateTime(v){
      if (!v) return '';
      const d = v.toDate ? v.toDate() : new Date(v);
      return isNaN(d) ? '' : d.toLocaleString('ar-IQ');
    }

    // يحسب الفرق بالأيام بين الآن وأي تاريخ Firestore (Timestamp أو نص قابل للتحويل)
    function millisOf(ts){
      if (!ts) return null;
      if (ts.toDate) return ts.toDate().getTime();
      if (ts.toMillis) return ts.toMillis();
      const d = new Date(ts);
      return isNaN(d) ? null : d.getTime();
    }

    // تنبيه: مر 10 أيام أو أكثر على استلام/إرسال الكتاب ولا يوجد أي اجراء (رد) مسجل عليه بعد
    function computeNeedsAlert(l){
      if (l._hasAction) return false;
      const ms = millisOf(l._rawDate);
      if (ms === null) return false;
      const days = Math.floor((Date.now() - ms) / 86400000);
      return days >= 10;
    }

    async function loadLetters(){
      try {
        // مصدرين: (1) incoming_letters = كتب واردة من جهات خارجية تنضاف يدوياً
        // (2) outgoing_letters اللي "الى" تبعها انربط تلقائياً بحساب موظف بالتطبيق (toUid) = كتاب صادر من مكتب/موظف ثاني وواصل لهذا الحساب
        const [incSnap, outSnap] = await Promise.all([
          db.collection('incoming_letters').get(),
          CURRENT_USER ? db.collection('outgoing_letters').where('toUid', '==', CURRENT_USER.uid).get() : Promise.resolve({ docs: [] })
        ]);

        const external = incSnap.docs.map(d => {
          const l = d.data();
          // الحالة الافتراضية "غير مقروء" لأي كتاب وارد خارجي ما انسجلت له حالة بعد
          // (مثلاً كتاب مضاف يدوياً بدون حقل status) — تنعدّل تلقائياً لـ"مقروء"/"مؤرشف" لاحقاً
          return Object.assign({ id: d.id, _source: 'incoming', _rawDate: l.receivedAt || l.createdAt || null, status: 'unread' }, l);
        });

        const internal = outSnap.docs.map(d => {
          const l = d.data();
          return {
            id: d.id,
            _source: 'outgoing',
            subject: l.subject,
            number: l.number,
            date: l.date,
            senderEntity: l.createdByName ? (l.createdByName + (l.createdByTitle ? ' - ' + l.createdByTitle : '')) : '—',
            recipientEntity: (CURRENT_PROFILE && CURRENT_PROFILE.name) || '—',
            receivedAt: fmtDateTime(l.createdAt),
            readAt: fmtDateTime(l.readAt),
            // "المؤرشفة": نفس منطق الكتب الخارجية، بس نخزنه بحقل "archived" منفصل عشان لا نتعارض
            // مع صفحة "الكتب الصادرة" اللي تعرض نفس المستند لصاحبه (المرسل) وما تستخدم status إطلاقاً
            status: l.archived ? 'archived' : (l.readAt ? 'read' : 'unread'),
            attachments: l.attachments || [],
            _rawDate: l.createdAt || null,
          };
        });

        ALL_LETTERS = external.concat(internal).sort((a, b) => (b.date || '').localeCompare(a.date || ''));

        // نتحقق هل انسجل اي اجراء (رد) على كل كتاب، عشان نحدد الكتب المتأخرة اللي تحتاج تنبيه
        await Promise.all(ALL_LETTERS.map(async l => {
          try {
            const c = l._source === 'outgoing' ? 'outgoing_letters' : 'incoming_letters';
            const snap = await db.collection(c).doc(l.id).collection('actions').limit(1).get();
            l._hasAction = !snap.empty;
          } catch(e){ l._hasAction = true; /* لا نعرض تنبيه إذا تعذر التحقق */ }
          l._needsAlert = computeNeedsAlert(l);
        }));
      } catch(e){
        console.warn('تعذر جلب الطلبات الواردة من Firestore (تحقق من الربط):', e);
        ALL_LETTERS = [];
      }
      renderTable();
    }

    function downloadLetterAttachments(letterId){
      const l = ALL_LETTERS.find(x => x.id === letterId);
      if (!l || !l.attachments || !l.attachments.length){ alert('لا توجد مرفقات لهذا الكتاب'); return; }
      const real = l.attachments.filter(a => a.url && a.url !== '#');
      if (!real.length){ alert('لم يتم رفع الملفات الفعلية لهذا الكتاب بعد'); return; }
      real.forEach(a => window.open(a.url, '_blank'));
    }

    function setFilter(f, btn){
      CURRENT_FILTER = f; CURRENT_PAGE = 1;
      document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTable();
    }

    function filteredLetters(){
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      return ALL_LETTERS.filter(l => {
        if (CURRENT_FILTER === 'unread' && l.status !== 'unread') return false;
        if (CURRENT_FILTER === 'archived' && l.status !== 'archived') return false;
        // "المحدثة": الكتب اللي تم تسجيل اجراء إداري واحد على الأقل عليها (نفس منطق تنبيه الـ10 أيام)
        if (CURRENT_FILTER === 'updated' && !l._hasAction) return false;
        if (!q) return true;
        // بحث عام: عنوان الكتاب، الرقم، التاريخ، الجهة المرسلة والجهة المستلمة
        const searchable = [l.subject, l.number, l.date, l.senderEntity, l.recipientEntity]
          .filter(Boolean).join(' ').toLowerCase();
        return searchable.includes(q);
      });
    }

    // يلوّن تبويبي "المحدثة" (أصفر) و"الغير مقروءة" (أخضر) لما فيهم كتب، مع عدد بجانب كل وحدة،
    // حتى ينتبه المستخدم لهم بسرعة بدون لا يحتاج يضغط عليهم أول
    function updateFilterTabStyles(){
      const updatedCount = ALL_LETTERS.filter(l => l._hasAction).length;
      const unreadCount = ALL_LETTERS.filter(l => l.status === 'unread').length;

      const updatedBtn = document.querySelector('[data-filter="updated"]');
      const unreadBtn = document.querySelector('[data-filter="unread"]');

      updatedBtn.classList.toggle('btn-warning', updatedCount > 0);
      updatedBtn.classList.toggle('btn-outline-secondary', updatedCount === 0);
      unreadBtn.classList.toggle('btn-success', unreadCount > 0);
      unreadBtn.classList.toggle('btn-outline-secondary', unreadCount === 0);
      unreadBtn.classList.toggle('text-white', unreadCount > 0);

      const updatedCountEl = updatedBtn.querySelector('[data-count-for="updated"]');
      const unreadCountEl = unreadBtn.querySelector('[data-count-for="unread"]');
      updatedCountEl.textContent = updatedCount > 0 ? '(' + updatedCount + ')' : '';
      unreadCountEl.textContent = unreadCount > 0 ? '(' + unreadCount + ')' : '';
    }

    function statusBadge(status){
      if (status === 'unread') return '<span class="badge badge-status-unread">غير مقروء</span>';
      if (status === 'archived') return '<span class="badge badge-status-archived">مؤرشف</span>';
      return '<span class="badge badge-status-read">مقروء</span>';
    }

    function renderTable(){
      updateFilterTabStyles();
      const pageSize = parseInt(document.getElementById('pageSizeSelect').value, 10);
      const data = filteredLetters();
      const totalPages = Math.max(1, Math.ceil(data.length / pageSize));
      if (CURRENT_PAGE > totalPages) CURRENT_PAGE = totalPages;
      const start = (CURRENT_PAGE - 1) * pageSize;
      const pageData = data.slice(start, start + pageSize);

      const tbody = document.getElementById('tableBody');
      if (!pageData.length){
        // نفرّق بين "ما فيه كتب أصلاً" و"فيه كتب بس الفلتر الحالي ما طابق شي" حتى لا نعطي انطباع خاطئ بعدم الربط
        const msg = ALL_LETTERS.length === 0
          ? 'لا توجد كتب لعرضها — اربط مجموعة incoming_letters بـ Firestore'
          : 'لا توجد كتب مطابقة لهذا الفلتر';
        tbody.innerHTML = `<tr><td colspan="12" class="text-center text-muted py-4">${msg}</td></tr>`;
      } else {
        tbody.innerHTML = pageData.map((l, i) => `
          <tr>
            <td><input type="checkbox" class="row-check" data-id="${l.id}"></td>
            <td>${start + i + 1}</td>
            <td>${l.subject || '—'}</td>
            <td>${l.number || '—'}</td>
            <td>${l.date || '—'}</td>
            <td>${l.senderEntity || '—'}</td>
            <td>${l.recipientEntity || '—'}</td>
            <td>${l.receivedAt || '—'}</td>
            <td>${l.readAt || '—'}</td>
            <td>${statusBadge(l.status)}</td>
            <td>
              ${l._needsAlert ? `<button class="btn btn-danger btn-sm" title="لم يسجل أي رد/اجراء خلال 10 أيام" onclick="location.href='view-letter.html?type=${l._source === 'outgoing' ? 'outgoing' : 'incoming'}&id=${l.id}'"><i class="fa-solid fa-triangle-exclamation"></i> تنبيه</button>` : ''}
            </td>
            <td>
              <button class="btn btn-success btn-sm" onclick="location.href='view-letter.html?type=${l._source === 'outgoing' ? 'outgoing' : 'incoming'}&id=${l.id}'"><i class="fa-solid fa-eye"></i> عرض</button>
              ${l._source === 'outgoing' ? '' : `<button class="btn btn-primary btn-sm" onclick="downloadLetterAttachments('${l.id}')"><i class="fa-solid fa-download"></i> تحميل</button>`}
            </td>
          </tr>`).join('');
      }

      // pagination
      const pag = document.getElementById('pagination');
      let html = '';
      for (let p = 1; p <= totalPages; p++){
        html += `<li class="page-item ${p===CURRENT_PAGE?'active':''}"><a class="page-link" href="#" onclick="goPage(${p}); return false;">${p}</a></li>`;
      }
      pag.innerHTML = html;
    }

    function goPage(p){ CURRENT_PAGE = p; renderTable(); }
    function toggleAll(cb){ document.querySelectorAll('.row-check').forEach(c => c.checked = cb.checked); }
    function getSelectedIds(){ return [...document.querySelectorAll('.row-check:checked')].map(c => c.dataset.id); }

    async function archiveSelected(){
      const ids = getSelectedIds();
      if (!ids.length) return alert('حدد كتاب واحد على الأقل');
      const selected = ALL_LETTERS.filter(l => ids.includes(l.id));
      // الكتب الخارجية (incoming_letters) تنؤرشف بحقل status، والكتب الداخلية (outgoing_letters)
      // تنؤرشف بحقل "archived" منفصل حتى لا تتأثر صفحة "الكتب الصادرة" تبع المرسل الأصلي بنفس المستند
      const externalIds = selected.filter(l => l._source !== 'outgoing').map(l => l.id);
      const internalIds = selected.filter(l => l._source === 'outgoing').map(l => l.id);
      try {
        await Promise.all([
          ...externalIds.map(id => db.collection('incoming_letters').doc(id).update({ status: 'archived' })),
          ...internalIds.map(id => db.collection('outgoing_letters').doc(id).update({ archived: true }))
        ]);
      } catch(e){
        console.error('تعذر أرشفة أحد الكتب:', e);
        alert('تعذر إتمام الأرشفة لبعض الكتب — تحقق من قواعد Firestore (firestore.rules) المحدّثة');
      }
      loadLetters();
    }
    function downloadSelectedAttachments(){
      const ids = getSelectedIds();
      if (!ids.length) return alert('حدد كتاب واحد على الأقل');
      let any = false;
      ids.forEach(id => {
        const l = ALL_LETTERS.find(x => x.id === id);
        if (l && l.attachments && l.attachments.length){
          l.attachments.filter(a => a.url && a.url !== '#').forEach(a => { window.open(a.url, '_blank'); any = true; });
        }
      });
      if (!any) alert('لا توجد ملفات مرفوعة فعلياً ضمن الكتب المحددة');
    }
    function downloadSelected(){
      const ids = getSelectedIds();
      if (!ids.length) return alert('حدد كتاب واحد على الأقل');
      exportExcel(ALL_LETTERS.filter(l => ids.includes(l.id)));
    }

    function exportExcel(rows){
      const data = (rows || filteredLetters()).map(l => ({
        'عنوان الكتاب': l.subject, 'الرقم': l.number, 'التاريخ': l.date,
        'الجهة المرسلة': l.senderEntity, 'الجهة المستلمة': l.recipientEntity,
        'تاريخ الاستلام': l.receivedAt, 'تاريخ القراءة': l.readAt, 'الحالة': l.status
      }));
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'الطلبات الواردة');
      XLSX.writeFile(wb, 'الطلبات_الواردة.xlsx');
    }
  </script>
</body>
</html>
