<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الطلبات الواردة</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-placeholder"></div>
    <div class="main-content">
      <div id="topbar-placeholder"></div>
      <div class="page-body">

        <div class="panel">
          <div class="panel-header d-flex justify-content-between align-items-center">
            <span>الطلبات الواردة</span>
            <button class="btn btn-sm btn-light" onclick="location.href='create-letter.html'"><i class="fa-solid fa-plus"></i> كتاب رسمي جديد</button>
          </div>
          <div class="panel-body">

            <div class="d-flex flex-wrap gap-2 mb-3">
              <button class="btn btn-secondary btn-sm" onclick="archiveSelected()"><i class="fa-solid fa-box-archive"></i> أرشفة المحدد</button>
              <button class="btn btn-info btn-sm text-white" onclick="downloadSelectedAttachments()"><i class="fa-solid fa-paperclip"></i> تحميل مرفقات المحددة</button>
              <button class="btn btn-primary btn-sm" onclick="downloadSelected()"><i class="fa-solid fa-download"></i> تحميل المحدد</button>

              <div class="btn-group btn-group-sm ms-auto" role="group">
                <button class="btn btn-outline-secondary active" data-filter="all" onclick="setFilter('all', this)">الكل</button>
                <button class="btn btn-outline-secondary" data-filter="updated" onclick="setFilter('updated', this)">المحدثة</button>
                <button class="btn btn-outline-secondary" data-filter="unread" onclick="setFilter('unread', this)">الغير مقروءة</button>
                <button class="btn btn-outline-secondary" data-filter="archived" onclick="setFilter('archived', this)">المؤرشفة</button>
              </div>
            </div>

            <div class="d-flex flex-wrap justify-content-between align-items-center mb-2 gap-2">
              <div class="d-flex align-items-center gap-2">
                <button class="btn btn-outline-secondary btn-sm" onclick="window.print()"><i class="fa-solid fa-print"></i> طباعة</button>
                <button class="btn btn-outline-success btn-sm" onclick="exportExcel()"><i class="fa-solid fa-file-excel"></i> Excel</button>
                <select id="pageSizeSelect" class="form-select form-select-sm w-auto" onchange="renderTable()">
                  <option value="10">10</option><option value="25">25</option><option value="50">50</option>
                </select>
              </div>
              <input type="text" id="searchInput" class="form-control form-control-sm w-auto" placeholder="ابحث..." oninput="renderTable()">
            </div>

            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead>
                  <tr>
                    <th><input type="checkbox" id="checkAll" onclick="toggleAll(this)"></th>
                    <th>ت</th>
                    <th>عنوان الكتاب</th>
                    <th>الرقم</th>
                    <th>التاريخ</th>
                    <th>الجهة المرسلة</th>
                    <th>الجهة المستلمة</th>
                    <th>تاريخ ووقت الاستلام</th>
                    <th>تاريخ ووقت القراءة</th>
                    <th>الحالة</th>
                    <th>خيارات</th>
                  </tr>
                </thead>
                <tbody id="tableBody">
                  <tr><td colspan="11" class="text-center text-muted py-4">جارِ التحميل...</td></tr>
                </tbody>
              </table>
            </div>

            <nav>
              <ul class="pagination pagination-sm justify-content-center" id="pagination"></ul>
            </nav>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth-guard.js"></script>
  <script src="sidebar.js"></script>
  <script>
    renderShell('incoming', 'الطلبات الواردة');

    let ALL_LETTERS = [];
    let CURRENT_FILTER = 'all';
    let CURRENT_PAGE = 1;

    AUTH_READY.then(loadLetters);
    PERMS_READY.then(() => {
      if (!hasPermission('deleteArchive')) {
        document.querySelector('button[onclick="archiveSelected()"]').style.display = 'none';
      }
    });

    async function loadLetters(){
      try {
        const snap = await db.collection('incoming_letters').orderBy('date', 'desc').get();
        ALL_LETTERS = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      } catch(e){
        console.warn('تعذر جلب الطلبات الواردة من Firestore (تحقق من الربط):', e);
        ALL_LETTERS = [];
      }
      renderTable();
    }

    function setFilter(f, btn){
      CURRENT_FILTER = f; CURRENT_PAGE = 1;
      document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTable();
    }

    function filteredLetters(){
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      return ALL_LETTERS.filter(l => {
        if (CURRENT_FILTER === 'unread' && l.status !== 'unread') return false;
        if (CURRENT_FILTER === 'archived' && l.status !== 'archived') return false;
        if (CURRENT_FILTER === 'updated' && !l.updatedAt) return false;
        if (!q) return true;
        return Object.values(l).join(' ').toLowerCase().includes(q);
      });
    }

    function statusBadge(status){
      if (status === 'unread') return '<span class="badge badge-status-unread">غير مقروء</span>';
      if (status === 'archived') return '<span class="badge badge-status-archived">مؤرشف</span>';
      return '<span class="badge badge-status-read">مقروء</span>';
    }

    function renderTable(){
      const pageSize = parseInt(document.getElementById('pageSizeSelect').value, 10);
      const data = filteredLetters();
      const totalPages = Math.max(1, Math.ceil(data.length / pageSize));
      if (CURRENT_PAGE > totalPages) CURRENT_PAGE = totalPages;
      const start = (CURRENT_PAGE - 1) * pageSize;
      const pageData = data.slice(start, start + pageSize);

      const tbody = document.getElementById('tableBody');
      if (!pageData.length){
        tbody.innerHTML = '<tr><td colspan="11" class="text-center text-muted py-4">لا توجد كتب لعرضها — اربط مجموعة incoming_letters بـ Firestore</td></tr>';
      } else {
        tbody.innerHTML = pageData.map((l, i) => `
          <tr>
            <td><input type="checkbox" class="row-check" data-id="${l.id}"></td>
            <td>${start + i + 1}</td>
            <td>${l.subject || '—'}</td>
            <td>${l.number || '—'}</td>
            <td>${l.date || '—'}</td>
            <td>${l.senderEntity || '—'}</td>
            <td>${l.recipientEntity || '—'}</td>
            <td>${l.receivedAt || '—'}</td>
            <td>${l.readAt || '—'}</td>
            <td>${statusBadge(l.status)}</td>
            <td>
              <button class="btn btn-success btn-sm" onclick="location.href='view-letter.html?type=incoming&id=${l.id}'"><i class="fa-solid fa-eye"></i> عرض</button>
              <button class="btn btn-primary btn-sm" onclick="alert('اربط رابط المرفق الفعلي هنا')"><i class="fa-solid fa-download"></i> تحميل</button>
            </td>
          </tr>`).join('');
      }

      // pagination
      const pag = document.getElementById('pagination');
      let html = '';
      for (let p = 1; p <= totalPages; p++){
        html += `<li class="page-item ${p===CURRENT_PAGE?'active':''}"><a class="page-link" href="#" onclick="goPage(${p}); return false;">${p}</a></li>`;
      }
      pag.innerHTML = html;
    }

    function goPage(p){ CURRENT_PAGE = p; renderTable(); }
    function toggleAll(cb){ document.querySelectorAll('.row-check').forEach(c => c.checked = cb.checked); }
    function getSelectedIds(){ return [...document.querySelectorAll('.row-check:checked')].map(c => c.dataset.id); }

    async function archiveSelected(){
      const ids = getSelectedIds();
      if (!ids.length) return alert('حدد كتاب واحد على الأقل');
      await Promise.all(ids.map(id => db.collection('incoming_letters').doc(id).update({ status: 'archived' })));
      loadLetters();
    }
    function downloadSelectedAttachments(){
      const ids = getSelectedIds();
      if (!ids.length) return alert('حدد كتاب واحد على الأقل');
      alert('اربط منطق تحميل المرفقات الفعلي (روابط تيليجرام/التخزين) هنا لعدد ' + ids.length + ' كتاب');
    }
    function downloadSelected(){
      const ids = getSelectedIds();
      if (!ids.length) return alert('حدد كتاب واحد على الأقل');
      exportExcel(ALL_LETTERS.filter(l => ids.includes(l.id)));
    }

    function exportExcel(rows){
      const data = (rows || filteredLetters()).map(l => ({
        'عنوان الكتاب': l.subject, 'الرقم': l.number, 'التاريخ': l.date,
        'الجهة المرسلة': l.senderEntity, 'الجهة المستلمة': l.recipientEntity,
        'تاريخ الاستلام': l.receivedAt, 'تاريخ القراءة': l.readAt, 'الحالة': l.status
      }));
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'الطلبات الواردة');
      XLSX.writeFile(wb, 'الطلبات_الواردة.xlsx');
    }
  </script>
</body>
</html>
