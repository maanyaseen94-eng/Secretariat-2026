<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الكتب الرسمية الصادرة</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-placeholder"></div>
    <div class="main-content">
      <div id="topbar-placeholder"></div>
      <div class="page-body">

        <div class="panel">
          <div class="panel-header d-flex justify-content-between align-items-center">
            <span>الكتب الرسمية الصادرة</span>
            <button class="btn btn-sm btn-light" onclick="location.href='create-letter.html'"><i class="fa-solid fa-plus"></i> كتاب رسمي جديد</button>
          </div>
          <div class="panel-body">
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead>
                  <tr><th>ت</th><th>الرقم</th><th>عنوان الكتاب</th><th>الى</th><th>التاريخ</th><th>خيارات</th></tr>
                </thead>
                <tbody id="tableBody">
                  <tr><td colspan="6" class="text-center text-muted py-4">جارِ التحميل...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth-guard.js"></script>
  <script src="sidebar.js"></script>
  <script>
    renderShell('outgoing', 'الكتب الرسمية الصادرة');

    AUTH_READY.then(async () => {
      const tbody = document.getElementById('tableBody');
      try {
        const snap = await db.collection('outgoing_letters').orderBy('createdAt', 'desc').get();
        if (!snap.size){
          tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">لا توجد كتب رسمية بعد — أنشئ واحد من زر "كتاب رسمي جديد"</td></tr>';
          return;
        }
        tbody.innerHTML = snap.docs.map((d, i) => {
          const l = d.data();
          return `<tr>
            <td>${i+1}</td><td>${l.number || '—'}</td><td>${l.subject || '—'}</td>
            <td>${l.to || '—'}</td><td>${l.date || '—'}</td>
            <td><button class="btn btn-success btn-sm" onclick="location.href='view-letter.html?type=outgoing&id=${d.id}'"><i class="fa-solid fa-eye"></i> عرض</button></td>
          </tr>`;
        }).join('');
      } catch(e){
        console.warn('تعذر جلب الكتب الصادرة:', e);
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">تعذر الاتصال بـ Firestore</td></tr>';
      }
    });
  </script>
</body>
</html>
