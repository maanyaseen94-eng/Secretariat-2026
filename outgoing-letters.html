<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الكتب الرسمية الصادرة</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-placeholder"></div>
    <div class="main-content">
      <div id="topbar-placeholder"></div>
      <div class="page-body">

        <div class="panel">
          <div class="panel-header d-flex justify-content-between align-items-center">
            <span>الكتب الرسمية الصادرة</span>
            <button class="btn btn-sm btn-light" onclick="location.href='create-letter.html'"><i class="fa-solid fa-plus"></i> كتاب رسمي جديد</button>
          </div>
          <div class="panel-body">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <button id="deleteSelectedBtn" class="btn btn-outline-danger btn-sm" onclick="deleteSelected()" style="display:none;"><i class="fa-solid fa-trash"></i> حذف المحدد</button>
              <button class="btn btn-outline-success btn-sm" onclick="exportExcel()"><i class="fa-solid fa-file-excel"></i> تصدير Excel</button>
            </div>
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead>
                  <tr><th><input type="checkbox" id="checkAll" onclick="toggleAll(this)"></th><th>ت</th><th>الرقم</th><th>عنوان الكتاب</th><th>الى</th><th>التاريخ</th><th>تاريخ ووقت القراءة</th><th>الحالة</th><th>خيارات</th></tr>
                </thead>
                <tbody id="tableBody">
                  <tr><td colspan="9" class="text-center text-muted py-4">جارِ التحميل...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth-guard.js"></script>
  <script src="sidebar.js"></script>
  <script>
    renderShell('outgoing', 'الكتب الرسمية الصادرة');

    let ALL_OUTGOING = [];
    let CAN_DELETE = false;

    // كل موظف يشوف الكتب اللي هو نفسه أنشأها بس؛ المدير (سكرتير النائب) يشوف كل الكتب الصادرة من الكل للمتابعة العامة
    PERMS_READY.then(({ role }) => {
      CAN_DELETE = hasPermission('deleteArchive');
      // زر الحذف الجماعي يبان فقط لصاحب صلاحية الحذف/الأرشفة — عمود التحديد نفسه يبقى ظاهر
      // للجميع (بدون خانات فعلية لغير المخوّلين) حتى لا يختل ترتيب أعمدة الجدول
      if (CAN_DELETE) document.getElementById('deleteSelectedBtn').style.display = '';
      loadLetters(role);
    });

    function getSelectedIds(){ return [...document.querySelectorAll('.row-check:checked')].map(c => c.dataset.id); }
    function toggleAll(cb){ document.querySelectorAll('.row-check').forEach(c => c.checked = cb.checked); }

    // حذف جماعي لكل الكتب المحددة بمرة وحدة، بدل حذف كتاب واحد كل مرة
    async function deleteSelected(){
      const ids = getSelectedIds();
      if (!ids.length) return alert('حدد كتاب واحد على الأقل');
      if (!confirm('حذف ' + ids.length + ' كتاب رسمي نهائياً؟ لا يمكن التراجع عن هذا الإجراء')) return;
      try {
        await Promise.all(ids.map(id => db.collection('outgoing_letters').doc(id).delete()));
        ALL_OUTGOING = ALL_OUTGOING.filter(l => !ids.includes(l.id));
        document.getElementById('checkAll').checked = false;
        renderTable();
      } catch(e){
        console.error(e);
        alert('تعذر حذف بعض الكتب المحددة — تحقق من صلاحياتك');
      }
    }

    function formatReadAt(l){
      if (!l.readAt) return '—';
      const d = l.readAt.toDate ? l.readAt.toDate() : new Date(l.readAt);
      return new Date(d).toLocaleString('ar-IQ') + (l.readByName ? `<br><span class="text-muted" style="font-size:11px;">بواسطة ${l.readByName}</span>` : '');
    }

    async function loadLetters(role){
      const tbody = document.getElementById('tableBody');
      try {
        const snap = (role === 'admin')
          ? await db.collection('outgoing_letters').get()
          : await db.collection('outgoing_letters').where('createdBy', '==', CURRENT_USER.uid).get();
        ALL_OUTGOING = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
        // ترتيب تنازلي حسب تاريخ الإنشاء (بدون الاعتماد على orderBy بـ Firestore تجنباً لأي فهرسة مركبة إضافية)
        ALL_OUTGOING.sort((a, b) => {
          const ta = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
          const tb = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
          return tb - ta;
        });
        renderTable();

        // نتحقق هل انسجل اي اجراء إداري (رد) على كل كتاب صادر، عشان نبين علامة "محدّث"
        // (نرندر الجدول مرة ثانية بعد ما توصل النتيجة، حتى الصفحة تبين بسرعة أول شي)
        await Promise.all(ALL_OUTGOING.map(async l => {
          try {
            const snap = await db.collection('outgoing_letters').doc(l.id).collection('actions').limit(1).get();
            l._hasAction = !snap.empty;
          } catch(e){ l._hasAction = false; }
        }));
        renderTable();
      } catch(e){
        console.warn('تعذر جلب الكتب الصادرة:', e);
        tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted py-4">تعذر الاتصال بـ Firestore</td></tr>';
      }
    }

    function renderTable(){
      const tbody = document.getElementById('tableBody');
      if (!ALL_OUTGOING.length){
        tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted py-4">لا توجد كتب رسمية بعد — أنشئ واحد من زر "كتاب رسمي جديد"</td></tr>';
        return;
      }
      tbody.innerHTML = ALL_OUTGOING.map((l, i) => `<tr>
        <td>${CAN_DELETE ? `<input type="checkbox" class="row-check" data-id="${l.id}">` : ''}</td>
        <td>${i+1}</td><td>${l.number || '—'}</td><td>${l.subject || '—'}</td>
        <td>${l.to || '—'}</td><td>${l.date || '—'}</td>
        <td style="font-size:12.5px;">${formatReadAt(l)}</td>
        <td>${l._hasAction ? '<span class="badge bg-warning text-dark">محدّث</span>' : '<span class="text-muted">—</span>'}</td>
        <td>
          <button class="btn btn-success btn-sm" onclick="location.href='view-letter.html?type=outgoing&id=${l.id}'"><i class="fa-solid fa-eye"></i> عرض</button>
          ${CAN_DELETE ? `<button class="btn btn-outline-danger btn-sm" onclick="deleteLetter('${l.id}')"><i class="fa-solid fa-trash"></i> حذف</button>` : ''}
        </td>
      </tr>`).join('');
    }

    async function deleteLetter(id){
      if (!confirm('حذف هذا الكتاب الرسمي نهائياً؟ لا يمكن التراجع عن هذا الإجراء')) return;
      try {
        await db.collection('outgoing_letters').doc(id).delete();
        ALL_OUTGOING = ALL_OUTGOING.filter(l => l.id !== id);
        renderTable();
      } catch(e){
        console.error(e);
        alert('تعذر الحذف — تحقق من صلاحياتك');
      }
    }

    function exportExcel(){
      const data = ALL_OUTGOING.map(l => ({
        'الرقم': l.number, 'عنوان الكتاب': l.subject, 'الى': l.to, 'التاريخ': l.date,
        'انشأه': l.createdByName || '', 'منصبه': l.createdByTitle || '',
        'تاريخ ووقت القراءة': l.readAt ? new Date(l.readAt.toDate ? l.readAt.toDate() : l.readAt).toLocaleString('ar-IQ') : '',
        'قرأه': l.readByName || ''
      }));
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'الكتب الصادرة');
      XLSX.writeFile(wb, 'الكتب_الرسمية_الصادرة.xlsx');
    }
  </script>
</body>
</html>
